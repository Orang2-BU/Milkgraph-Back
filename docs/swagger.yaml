swagger: '2.0'
info:
  title: Milkgraph-Back API
  version: 1.0.0
  description: Dokumentasi route aktual Go. Data pabrik, jadwal, graph dan trace adalah snapshot simulasi; MODE=live
    hanya mengubah autentikasi (JWT), tidak membuat konektor/solver live. Mutation/state, audit, event membutuhkan
    PostgreSQL. Body JSON ditolak bila field tak dikenal. Mode demo menggunakan X-Demo-Role atau Bearer JWT; mode
    live mewajibkan Bearer JWT HS256 dan menolak X-Demo-Role. Tidak ada endpoint login/token. CORS OPTIONS ditangani
    middleware global (204), bukan route spesifik. Fallback 404 untuk path lain tidak dimodelkan sebagai route.
  license:
    name: Internal
basePath: /
schemes:
- http
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: Bearer <JWT> HS256; wajib di MODE=live, juga diterima di demo. JWT memuat exp, sub, role, name;
      iss/aud bila dikonfigurasi.
  demoRole:
    type: apiKey
    name: X-Demo-Role
    in: header
    description: 'Hanya MODE=demo: planner, receiving, supervisor, qa. Tidak diizinkan di MODE=live.'
security:
- bearerAuth: []
- demoRole: []
paths:
  /api/v1/assets:
    get:
      summary: Assets
      operationId: get_api_v1_assets
      description: Snapshot fixture; tidak terhubung ke sistem pabrik langsung.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/Assets'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
  /api/v1/assets/cip-log:
    get:
      summary: Assets/cip log
      operationId: get_api_v1_assets_cip_log
      description: Snapshot fixture; tidak terhubung ke sistem pabrik langsung.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/CIPLog'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
  /api/v1/assets/cip-policy:
    get:
      summary: Assets/cip policy
      operationId: get_api_v1_assets_cip_policy
      description: Snapshot fixture; tidak terhubung ke sistem pabrik langsung.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/CIPPolicy'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
  /api/v1/assets/mid-tanks:
    get:
      summary: Assets/mid tanks
      operationId: get_api_v1_assets_mid_tanks
      description: Snapshot fixture; tidak terhubung ke sistem pabrik langsung.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/MidTanks'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
  /api/v1/assistant/ask:
    post:
      summary: Tanya bukti terdaftar
      operationId: post_api_v1_assistant_ask
      description: 'Pencocokan bentuk pertanyaan terbatas. Pertanyaan lain menghasilkan {id: unknown, question};
        bukan LLM.'
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/TraceAnswer'
        '400':
          description: Input tidak valid.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
        '415':
          description: Content-Type bukan application/json.
          schema:
            $ref: '#/definitions/Error'
        '422':
          description: Validasi bisnis/parameter gagal.
          schema:
            $ref: '#/definitions/Error'
      parameters:
      - name: body
        in: body
        required: true
        description: Objek JSON.
        schema:
          $ref: '#/definitions/AskRequest'
  /api/v1/assistant/templates:
    get:
      summary: Template pertanyaan
      operationId: get_api_v1_assistant_templates
      description: Tiga template dari jawaban fixture.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/Templates'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
  /api/v1/audit:
    get:
      summary: Audit JSON
      operationId: get_api_v1_audit
      description: JSON array tanpa wrapper/pagination metadata. Dari PostgreSQL atau audit fixture bila DB nil.
      responses:
        '200':
          description: Sukses.
          schema:
            type: array
            items:
              $ref: '#/definitions/AuditEntry'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
        '422':
          description: Validasi bisnis/parameter gagal.
          schema:
            $ref: '#/definitions/Error'
      parameters:
      - name: kind
        in: query
        description: Filter kategori audit.
        required: false
        type: string
        enum:
        - rencana
        - hold
        - lab
        - constraint
        - instruksi
      - name: before
        in: query
        type: integer
        format: int64
        minimum: 1
        required: false
        description: Cursor ID eksklusif; harus positif.
      - name: limit
        in: query
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
        required: false
        description: Batas baris per halaman.
  /api/v1/audit.csv:
    get:
      summary: Ekspor audit CSV
      operationId: get_api_v1_audit_csv
      description: UTF-8 BOM; Content-Disposition attachment; kolom Waktu,Jenis,Keputusan,Objek,Catatan,Oleh,Peran.
      responses:
        '200':
          description: File CSV UTF-8 BOM.
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
        '422':
          description: Validasi bisnis/parameter gagal.
          schema:
            $ref: '#/definitions/Error'
      produces:
      - text/csv
      - application/json
      parameters:
      - name: kind
        in: query
        description: Filter kategori audit.
        required: false
        type: string
        enum:
        - rencana
        - hold
        - lab
        - constraint
        - instruksi
      - name: before
        in: query
        type: integer
        format: int64
        minimum: 1
        required: false
        description: Cursor ID eksklusif.
      - name: limit
        in: query
        type: integer
        minimum: 1
        maximum: 1000
        required: false
        description: Divalidasi, tetapi ekspor tetap semua halaman (batch internal 1000), bukan membatasi hasil.
  /api/v1/data-sources:
    get:
      summary: Katalog sumber data
      operationId: get_api_v1_data_sources
      description: Sumber fixture; simulation=true; bukan konektor aktif.
      responses:
        '200':
          description: Sukses.
          schema:
            type: array
            items:
              $ref: '#/definitions/DataSource'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
  /api/v1/data-sources/{id}/sync:
    post:
      summary: Simpan timestamp sync simulasi
      operationId: post_api_v1_data_sources_id_sync
      description: Menulis state simulation=true; tidak menarik data dari sistem eksternal. Body kosong atau {}.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/WriteResponse'
        '400':
          description: Input tidak valid.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Data tidak ditemukan.
          schema:
            $ref: '#/definitions/Error'
        '415':
          description: Content-Type bukan application/json.
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Database atau realtime tidak tersedia.
          schema:
            $ref: '#/definitions/Error'
      parameters:
      - name: id
        in: path
        required: true
        type: string
        description: ID sumber daya.
      - name: body
        in: body
        required: false
        description: Objek JSON opsional; body kosong diperbolehkan.
        schema:
          $ref: '#/definitions/EmptyBody'
  /api/v1/data-sources/{id}/test:
    post:
      summary: Uji sumber simulasi
      operationId: post_api_v1_data_sources_id_test
      description: Selalu ok=false, simulation=true; tidak mencoba koneksi nyata. Body kosong atau {}.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/SourceTest'
        '400':
          description: Input tidak valid.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Data tidak ditemukan.
          schema:
            $ref: '#/definitions/Error'
        '415':
          description: Content-Type bukan application/json.
          schema:
            $ref: '#/definitions/Error'
      parameters:
      - name: id
        in: path
        required: true
        type: string
        description: ID sumber daya.
      - name: body
        in: body
        required: false
        description: Objek JSON opsional; body kosong diperbolehkan.
        schema:
          $ref: '#/definitions/EmptyBody'
  /api/v1/decisions:
    get:
      summary: Daftar keputusan rencana
      operationId: get_api_v1_decisions
      description: Kosong jika DB tidak dikonfigurasi; state keputusan durable bila DB ada.
      responses:
        '200':
          description: Sukses.
          schema:
            type: array
            items:
              $ref: '#/definitions/PlanDecision'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
  /api/v1/demo/reset:
    post:
      summary: Reset state demo
      operationId: post_api_v1_demo_reset
      description: 'Menghapus state transaksi demo PostgreSQL; body kosong atau {}. Respons result.ok=true, log=null.

        Hanya MODE=demo; MODE=live mengembalikan 403 setelah autentikasi.'
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/WriteResponse'
        '400':
          description: Input tidak valid.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Mode/permission ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
        '415':
          description: Content-Type bukan application/json.
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Database atau realtime tidak tersedia.
          schema:
            $ref: '#/definitions/Error'
      parameters:
      - name: body
        in: body
        required: false
        description: Objek JSON opsional; body kosong diperbolehkan.
        schema:
          $ref: '#/definitions/EmptyBody'
  /api/v1/events:
    get:
      summary: Stream SSE perubahan
      operationId: get_api_v1_events
      description: text/event-stream; frame id/event/data JSON; heartbeat tiap 15 detik. Replay dibatasi 1000 event,
        lalu 409. Respons error dari hub berupa text/plain.
      responses:
        '200':
          description: 'Stream SSE, bukan JSON document; frame: id, event, data (JSON).'
        '400':
          description: Input tidak valid. Hub dapat mengembalikan text/plain, bukan Error JSON.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Konflik atau event replay terlalu panjang. Hub dapat mengembalikan text/plain, bukan Error
            JSON.
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Database atau realtime tidak tersedia. Hub dapat mengembalikan text/plain, bukan Error JSON.
          schema:
            $ref: '#/definitions/Error'
      produces:
      - text/event-stream
      - application/json
      - text/plain
      parameters:
      - name: Last-Event-ID
        in: header
        description: Cursor event >=0 untuk replay; tanpa header mulai dari event terbaru.
        required: false
        type: string
  /api/v1/graph:
    get:
      summary: Snapshot graph konteks
      operationId: get_api_v1_graph
      description: Graph fixture tervalidasi; tautan termasuk konteks/planned, bukan bukti transfer material.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/Graph'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
  /api/v1/graph/subgraph:
    get:
      summary: Subgraph keluar
      operationId: get_api_v1_graph_subgraph
      description: Snapshot fixture; bukan graph transaksi real-time.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/Graph'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Data tidak ditemukan.
          schema:
            $ref: '#/definitions/Error'
        '422':
          description: Validasi bisnis/parameter gagal.
          schema:
            $ref: '#/definitions/Error'
      parameters:
      - name: node
        in: query
        description: ID node graph; wajib untuk hasil yang ditemukan.
        required: true
        type: string
      - name: depth
        in: query
        type: integer
        minimum: 0
        maximum: 32
        default: 1
        required: false
        description: Kedalaman traversal outgoing, 0..32.
  /api/v1/holds:
    get:
      summary: Daftar hold
      operationId: get_api_v1_holds
      description: Gabungan riwayat fixture dan state hold PostgreSQL.
      responses:
        '200':
          description: Sukses.
          schema:
            type: array
            items:
              $ref: '#/definitions/Hold'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
    post:
      summary: Ajukan hold
      operationId: post_api_v1_holds
      description: 'hold.submit (planner/supervisor/qa). Lot diverifikasi dan diganti dari bukti trace. 201 + Location:
        /api/v1/holds/{id}.

        Permission: hold.submit.'
      responses:
        '201':
          description: Created; result dan log JSON.
          schema:
            $ref: '#/definitions/WriteResponse'
          headers:
            Location:
              type: string
              description: /api/v1/holds/{id}
        '400':
          description: Input tidak valid.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Mode/permission ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Konflik atau event replay terlalu panjang.
          schema:
            $ref: '#/definitions/Error'
        '415':
          description: Content-Type bukan application/json.
          schema:
            $ref: '#/definitions/Error'
        '422':
          description: Validasi bisnis/parameter gagal.
          schema:
            $ref: '#/definitions/Error'
        '503':
          description: Database atau realtime tidak tersedia.
          schema:
            $ref: '#/definitions/Error'
      parameters:
      - name: body
        in: body
        required: true
        description: Objek JSON.
        schema:
          $ref: '#/definitions/HoldRequest'
  /api/v1/holds/summary:
    get:
      summary: Holds/summary
      operationId: get_api_v1_holds_summary
      description: Snapshot fixture; tidak terhubung ke sistem pabrik langsung.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/HoldSummary'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
          description: Body lebih dari 64 KiB.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Kesalahan internal.
          schema:
            $ref: '#/definitions/Error'
  /api/v1/holds/{id}/genealogy:
    get:
      summary: Genealogi hold
      operationId: get_api_v1_holds_id_genealogy
      description: Merakit bukti trace fixture, lab dan lokasi lot.
      responses:
        '200':
          description: Sukses.
          schema:
            $ref: '#/definitions/Genealogy'
        '400':
          description: Bad request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Autentikasi gagal.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Asal request/role ditolak.
          schema:
            $ref: '#/definitions/Error'
        '413':
