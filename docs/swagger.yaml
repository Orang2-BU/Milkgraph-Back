  Error:
    type: object
    properties:
      error:
        $ref: '#/definitions/ErrorDetail'
    required:
    - error
  ErrorDetail:
    type: object
    properties:
      code:
        type: string
      message:
        type: string
      field:
        type: string
    required:
    - code
    - message
  EmptyBody:
    type: object
    properties: {}
  RoleSelection:
    type: object
    properties:
      role:
        type: string
        enum:
        - planner
        - receiving
        - supervisor
        - qa
    required:
    - role
  AskRequest:
    type: object
    properties:
      question:
        type: string
        minLength: 1
        maxLength: 1000
    required:
    - question
  PlanDecisionRequest:
    type: object
    properties:
      status:
        type: string
        enum:
        - approved
        - rejected
      note:
        type: string
        maxLength: 500
    required:
    - status
